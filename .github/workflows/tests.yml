name: tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        groups:
          - name: fast
            specs: "cypress/tests/**/*.spec.js"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cypress run (${{ matrix.groups.name }} suites) # Installe aussi les dépendances npm
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run dev
          wait-on: http://localhost:3000 
          spec: ${{ matrix.groups.specs }}